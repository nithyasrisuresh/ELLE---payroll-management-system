<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - ELLE.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }

    .sidebar {
      width: 240px; height: 100vh; background: #1a1a2e;
      position: fixed; top: 0; left: 0;
      display: flex; flex-direction: column; padding: 24px 0;
    }
    .sidebar h2 { color: white; text-align: center; font-size: 18px; margin-bottom: 32px; }
    .sidebar a {
      color: #aaa; text-decoration: none;
      padding: 12px 24px; font-size: 14px; display: block; transition: all 0.2s;
    }
    .sidebar a:hover, .sidebar a.active { background: #4f46e5; color: white; }
    .sidebar .logout { margin-top: auto; color: #ff6b6b; padding: 12px 24px; cursor: pointer; font-size: 14px; }

    .main { margin-left: 240px; padding: 32px; }
    .top-bar {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 24px; gap: 16px;
    }
    .top-bar h1 { font-size: 24px; color: #1a1a2e; }

    /* Search bar */
    .search-wrap { flex: 1; max-width: 340px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 10px 16px 10px 40px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; outline: none; background: white;
    }
    .search-wrap input:focus { border-color: #4f46e5; }
    .search-wrap .icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); font-size: 16px; pointer-events: none;
    }

    .btn { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn:hover { background: #4338ca; }
    .btn-danger { background: #ef4444; padding: 6px 12px; font-size: 13px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-edit { background: #f59e0b; padding: 6px 12px; font-size: 13px; }
    .btn-edit:hover { background: #d97706; }

    .table-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 14px 16px; text-align: left; font-size: 13px; color: #666; border-bottom: 1px solid #eee; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    /* Department badge */
    .dept-badge {
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
    }
    .dept-HR         { background: #fce7f3; color: #be185d; }
    .dept-Finance    { background: #d1fae5; color: #065f46; }
    .dept-IT         { background: #dbeafe; color: #1d4ed8; }
    .dept-Operations { background: #fef3c7; color: #92400e; }
    .dept-default    { background: #f3f4f6; color: #374151; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 24px; color: #1a1a2e; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #4f46e5; }
    .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
    .btn-cancel { padding: 10px 20px; background: #f0f0f0; color: #333; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }

    .no-results { text-align: center; color: #999; padding: 32px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>💼 ELLE.</h2>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="employees.html" class="active">👥 Employees</a>
    <a href="payroll.html">💰 Payroll</a>
    <a href="reports.html">📊 Reports</a>
    <div class="logout" onclick="logout()">🚪 Logout</div>
  </div>

  <div class="main">
    <div class="top-bar">
      <h1>👥 Employees</h1>
      <!-- Search Bar -->
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="search" placeholder="Search by name, email, designation..." oninput="filterEmployees()">
      </div>
      <button class="btn" onclick="openModal()">+ Add Employee</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Designation</th>
            <th>Department</th>
            <th>Basic Salary</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="emp-table">
          <tr><td colspan="8" style="text-align:center;color:#999">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Add Employee</h2>
      <input type="hidden" id="emp-id">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="Enter phone number">
      </div>
      <div class="form-group">
        <label>Designation</label>
        <input type="text" id="designation" placeholder="e.g. Software Engineer">
      </div>
      <div class="form-group">
  <label>Domain</label>
   <select id="domain" onchange="filterDepartments()">
  <option value="">-- Select Domain --</option>
  <option>Business Administration</option>
  <option>Digital & Engineering</option>
  <option>Global Operations</option>
  <option>Manufacturing</option>
  <option>Technology</option>
  <option>Commercial</option>
</select>
</div>
<div class="form-group">
  <label>Department</label>
  <select id="department_id">
    <option value="">-- Select Domain First --</option>
  </select>
</div>
      <div class="form-group">
        <label>Basic Salary (₹)</label>
        <input type="number" id="basic_salary" placeholder="Enter basic salary">
      </div>
      <div class="form-group">
        <label>Join Date</label>
        <input type="date" id="join_date">
      </div>
      <div class="modal-buttons">
        <button class="btn" onclick="saveEmployee()">Save</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    // Department map
    const departments = {
  1: 'HR', 2: 'Finance', 3: 'Accounting', 4: 'Legal', 5: 'Admin', 6: 'Procurement',
  7: 'IT', 8: 'Software Development', 9: 'Cybersecurity', 10: 'Data Analytics',
  11: 'AI & ML', 12: 'DevOps', 13: 'QA & Testing',
  14: 'Operations', 15: 'Logistics', 16: 'Supply Chain', 17: 'Warehouse', 18: 'Facilities Management',
  19: 'Production', 20: 'Quality Control', 21: 'Maintenance', 22: 'Safety & Health',
  23: 'IT', 24: 'Software Development', 25: 'Cybersecurity', 26: 'Data Analytics',
  27: 'AI & ML', 28: 'DevOps', 29: 'QA & Testing',
  30: 'Sales', 31: 'Marketing', 32: 'Customer Support', 33: 'Public Relations', 34: 'Business Development'
};

    let allEmployees = []; // store all for filtering
    let allDepartments = [];

async function loadDepartments() {
const res = await fetch(`${API}/departments`);  allDepartments = await res.json();
}

function filterDepartments() {
  const domain = document.getElementById('domain').value;
  const select = document.getElementById('department_id');
  select.innerHTML = '<option value="">-- Select Department --</option>';
  allDepartments
    .filter(d => d.domain === domain)
    .forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.name;
      select.appendChild(opt);
    });
}

    // Load all employees
    async function loadEmployees() {
      const res = await fetch(`${API}/employees`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      allEmployees = await res.json();
      renderTable(allEmployees);
    }

    // Render table with given data
    function renderTable(data) {
      const tbody = document.getElementById('emp-table');

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="no-results">No employees found</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((e, i) => {
        const deptName = departments[e.department_id] || 'Unknown';
        const deptClass = `dept-${deptName}`;
        return `
          <tr>
            <td>${i + 1}</td>
            <td><strong>${e.name}</strong></td>
            <td>${e.email || '-'}</td>
            <td>${e.phone || '-'}</td>
            <td>${e.designation || '-'}</td>
            <td><span class="dept-badge ${deptClass}">${deptName}</span></td>
            <td>₹${parseFloat(e.basic_salary).toLocaleString()}</td>
            <td>
              <button class="btn btn-edit" onclick='editEmployee(${JSON.stringify(e)})'>Edit</button>
              <button class="btn btn-danger" onclick="deleteEmployee(${e.id})">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Filter employees by search input
    function filterEmployees() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allEmployees.filter(e =>
        e.name.toLowerCase().includes(query) ||
        (e.email && e.email.toLowerCase().includes(query)) ||
        (e.designation && e.designation.toLowerCase().includes(query)) ||
        (departments[e.department_id] && departments[e.department_id].toLowerCase().includes(query))
      );
      renderTable(filtered);
    }

    function openModal() {
      document.getElementById('modal-title').textContent = 'Add Employee';
      document.getElementById('emp-id').value = '';
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('designation').value = '';
      document.getElementById('basic_salary').value = '';
      document.getElementById('join_date').value = '';
      document.getElementById('modal').classList.add('show');
    }

    function editEmployee(e) {
      document.getElementById('modal-title').textContent = 'Edit Employee';
      document.getElementById('emp-id').value = e.id;
      document.getElementById('name').value = e.name;
      document.getElementById('email').value = e.email || '';
      document.getElementById('phone').value = e.phone || '';
      document.getElementById('designation').value = e.designation || '';
      document.getElementById('department_id').value = e.department_id;
      document.getElementById('basic_salary').value = e.basic_salary;
      document.getElementById('join_date').value = e.join_date ? e.join_date.split('T')[0] : '';
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    async function saveEmployee() {
      const id = document.getElementById('emp-id').value;
      const body = {
        name:          document.getElementById('name').value,
        email:         document.getElementById('email').value,
        phone:         document.getElementById('phone').value,
        designation:   document.getElementById('designation').value,
        department_id: document.getElementById('department_id').value,
        basic_salary:  document.getElementById('basic_salary').value,
        join_date:     document.getElementById('join_date').value
      };

      if (!body.name) { alert('Name is required!'); return; }

      const url    = id ? `${API}/employees/${id}` : `${API}/employees`;
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        closeModal();
        loadEmployees();
      } else {
        alert('Error: ' + data.message);
      }
    }

    async function deleteEmployee(id) {
      if (!confirm('Are you sure you want to delete this employee?')) return;
      await fetch(`${API}/employees/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });
      loadEmployees();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }

loadDepartments();
loadEmployees();
  </script>
</body>
</html>
