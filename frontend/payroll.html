<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll - ELLE.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    .sidebar {
      width: 240px; height: 100vh; background: #1a1a2e;
      position: fixed; top: 0; left: 0;
      display: flex; flex-direction: column; padding: 24px 0;
    }
    .sidebar h2 { color: white; text-align: center; font-size: 18px; margin-bottom: 32px; }
    .sidebar a { color: #aaa; text-decoration: none; padding: 12px 24px; font-size: 14px; display: block; transition: all 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: #4f46e5; color: white; }
    .sidebar .logout { margin-top: auto; color: #ff6b6b; padding: 12px 24px; cursor: pointer; font-size: 14px; }
    .main { margin-left: 240px; padding: 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .top-bar h1 { font-size: 24px; color: #1a1a2e; }
    .btn { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn:hover { background: #4338ca; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
    .card h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #4f46e5; }
    .result-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 16px; margin-top: 16px; display: none; }
    .result-box h3 { color: #16a34a; font-size: 20px; }
    .result-box p { color: #555; font-size: 14px; margin-top: 4px; }
    .table-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 14px 16px; text-align: left; font-size: 13px; color: #666; border-bottom: 1px solid #eee; }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; background: #dbeafe; color: #1d4ed8; }
    .btn-payslip { padding: 5px 12px; background: #0f766e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .btn-payslip:hover { background: #0d9488; }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>💼 ELLE.</h2>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="employees.html">👥 Employees</a>
    <a href="payroll.html" class="active">💰 Payroll</a>
    <a href="reports.html">📊 Reports</a>
    <div class="logout" onclick="logout()">🚪 Logout</div>
  </div>

  <div class="main">
    <div class="top-bar">
      <h1>💰 Payroll Management</h1>
    </div>

    <div class="card">
      <h2>Generate Payroll</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Select Employee</label>
          <select id="employee_id">
            <option value="">-- Select Employee --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Month</label>
          <input type="month" id="month">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Allowances (₹)</label>
          <input type="number" id="allowances" placeholder="e.g. 5000" value="0">
        </div>
        <div class="form-group">
          <label>Deductions (₹)</label>
          <input type="number" id="deductions" placeholder="e.g. 2000" value="0">
        </div>
      </div>
      <button class="btn" onclick="generatePayroll()">🧮 Generate Payroll</button>

      <div class="result-box" id="result-box">
        <p>Net Salary for selected employee</p>
        <h3 id="net-salary">₹0</h3>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Employee</th>
            <th>Month</th>
            <th>Basic</th>
            <th>Allowances</th>
            <th>Deductions</th>
            <th>Net Salary</th>
            <th>Generated On</th>
            <th>Payslip</th>
          </tr>
        </thead>
        <tbody id="payroll-table">
          <tr><td colspan="9" style="text-align:center;color:#999">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API = 'https://elle-payroll-management-system.onrender.com/';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    async function loadEmployees() {
      const res = await fetch(`${API}/employees`);
      const data = await res.json();
      const select = document.getElementById('employee_id');
      data.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = e.name;
        opt.dataset.salary = e.basic_salary;
        opt.dataset.designation = e.designation || 'Employee';
        select.appendChild(opt);
      });
    }

    async function loadPayroll() {
      const res = await fetch(`${API}/payroll`);
      const data = await res.json();
      const tbody = document.getElementById('payroll-table');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999">No payroll records found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map((p, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${p.employee_name}</td>
          <td><span class="badge">${p.month}</span></td>
          <td>₹${parseFloat(p.basic).toLocaleString()}</td>
          <td>₹${parseFloat(p.allowances).toLocaleString()}</td>
          <td>₹${parseFloat(p.deductions).toLocaleString()}</td>
          <td><strong>₹${parseFloat(p.net_salary).toLocaleString()}</strong></td>
          <td>${new Date(p.generated_on).toLocaleDateString()}</td>
          <td><button class="btn-payslip" onclick='generatePayslip(${JSON.stringify(p)})'>🖨️ Payslip</button></td>
        </tr>
      `).join('');
    }

    async function generatePayroll() {
      const select      = document.getElementById('employee_id');
      const employee_id = select.value;
      const month       = document.getElementById('month').value;
      const allowances  = document.getElementById('allowances').value;
      const deductions  = document.getElementById('deductions').value;

      if (!employee_id || !month) { alert('Please select employee and month!'); return; }

      const res = await fetch(`${API}/payroll/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employee_id, month, allowances, deductions })
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('net-salary').textContent = `₹${parseFloat(data.net_salary).toLocaleString()}`;
        loadPayroll();
      } else {
        alert('Error: ' + data.message);
      }
    }

    function generatePayslip(p) {
      const params = new URLSearchParams({
        name:        p.employee_name,
        month:       p.month,
        basic:       p.basic,
        allowances:  p.allowances,
        deductions:  p.deductions,
        net:         p.net_salary,
        date:        p.generated_on,
        designation: 'Employee'
      });
      window.open(`payslip.html?${params.toString()}`, '_blank');
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }

    loadEmployees();
    loadPayroll();
  </script>
</body>
</html>
